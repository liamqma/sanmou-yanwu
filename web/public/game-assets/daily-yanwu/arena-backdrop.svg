<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">暖橙暮色中的演武擂台</title>
  <desc id="desc">暮色山峦、战旗、巨鼓、木质擂台与低雾组成的中式演武场景。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a281b"/>
      <stop offset=".34" stop-color="#b05b2c"/>
      <stop offset=".68" stop-color="#b6723d"/>
      <stop offset="1" stop-color="#3a2b25"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd78a" stop-opacity=".92"/>
      <stop offset=".34" stop-color="#f0a34f" stop-opacity=".56"/>
      <stop offset="1" stop-color="#cd6b32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5b3b2c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#211b19" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b4a28"/>
      <stop offset=".24" stop-color="#3a2018"/>
      <stop offset=".54" stop-color="#6c3823"/>
      <stop offset=".78" stop-color="#281814"/>
      <stop offset="1" stop-color="#5d2f20"/>
    </linearGradient>
    <radialGradient id="drumSkin" cx="40%" cy="32%" r="70%">
      <stop stop-color="#d9b176"/>
      <stop offset=".48" stop-color="#9c744d"/>
      <stop offset=".76" stop-color="#5d402e"/>
      <stop offset="1" stop-color="#30211b"/>
    </radialGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5a3526"/>
      <stop offset=".45" stop-color="#2d1d19"/>
      <stop offset="1" stop-color="#15100f"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#351514"/>
      <stop offset=".35" stop-color="#7d2d21"/>
      <stop offset="1" stop-color="#321513"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d7b48b" stop-opacity="0"/>
      <stop offset=".3" stop-color="#d7b48b" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#a49a90" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a49a90" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#100907" flood-opacity=".72"/>
    </filter>
    <pattern id="planks" width="92" height="18" patternUnits="userSpaceOnUse">
      <rect width="92" height="18" fill="#37231b"/>
      <path d="M0 17.5h92M91.5 0v18" stroke="#160f0d" stroke-width="1"/>
      <path d="M7 5c22-5 41 5 67-1" fill="none" stroke="#7b4d32" stroke-opacity=".25"/>
    </pattern>
  </defs>

