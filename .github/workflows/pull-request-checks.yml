name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect changed workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
      agent: ${{ steps.changes.outputs.agent }}
      data: ${{ steps.changes.outputs.data }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          web=false
          agent=false
          data=false
          image=false
          all=false
          changed_paths="$(mktemp "$RUNNER_TEMP/pull-request-changed-paths.XXXXXX")"
          trap 'rm -f "$changed_paths"' EXIT

          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"; then
            echo "Unable to determine changed pull-request paths" >&2
            exit 1
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|README|*/README|README.*|*/README.*)
                continue
                ;;
              .github/workflows/*)
                all=true
                ;;
              web/*)
                web=true
                ;;
              agent/*)
                agent=true
                ;;
              data/*)
                data=true
                ;;
              image_extraction/*)
                image=true
                ;;
              .node-version)
                web=true
                agent=true
                ;;
              .python-version|pyproject.toml|uv.lock|uv.toml|Makefile)
                data=true
                image=true
                ;;
            esac

            case "$path" in
              web/public/game-data/database.json)
                agent=true
                data=true
                image=true
                ;;
              web/src/recommendation_data.json)
                agent=true
                data=true
                ;;
            esac
          done < "$changed_paths"

          if [[ "$all" == true ]]; then
            web=true
            agent=true
            data=true
            image=true
          fi

          {
            echo "web=$web"
            echo "agent=$agent"
            echo "data=$data"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Pull request test scope"
            echo
            echo "| Workspace | Run tests |"
            echo "| --- | --- |"
            echo "| web | $web |"
            echo "| agent | $agent |"
            echo "| data | $data |"
            echo "| image extraction | $image |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web checks
    if: needs.scope.outputs.web == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run end-to-end and prerender tests
        run: pnpm test:e2e

      - name: Build production site
        run: pnpm build

  agent:
    name: Agent checks
    if: needs.scope.outputs.agent == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  data:
    name: Data checks
    if: needs.scope.outputs.data == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run offline data-builder tests
        run: make test-data

  image:
    name: Image-extraction checks
    if: needs.scope.outputs.image == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --locked --all-packages

      - name: Run image-extraction tests
        run: make test

  required:
    name: Required PR checks
    if: always()
    needs:
      - scope
      - web
      - agent
      - data
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      WEB_RESULT: ${{ needs.web.result }}
      AGENT_RESULT: ${{ needs.agent.result }}
      DATA_RESULT: ${{ needs.data.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every applicable workspace check
        run: |
          failed=false
          for result in \
            "$SCOPE_RESULT" \
            "$WEB_RESULT" \
            "$AGENT_RESULT" \
            "$DATA_RESULT" \
            "$IMAGE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done
          if [[ "$failed" == true ]]; then
            echo "At least one required pull-request check did not pass" >&2
            exit 1
          fi
