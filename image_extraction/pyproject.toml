[project]
name = "image-extraction"
version = "0.1.0"
description = "OCR-based extraction of battle data from game screenshots"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddlepaddle",
    "paddleocr>=3.7,<4",
    "opencv-python",
    "numpy",
    "pypinyin",
]

[tool.uv]
package = false
