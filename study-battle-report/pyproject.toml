[project]
name = "study-battle-report"
version = "0.1.0"
description = "Local GLM transcription with character-localized battle-log colour tagging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "rapidocr==3.9.2",
    "onnxruntime==1.26.0",
    "mlx-vlm==0.7.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# Deliberately independent from the root/image_extraction environment: GLM's
# transformer/MLX dependencies must not change the separate Paddle pipeline.
[tool.uv.workspace]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
